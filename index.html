<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark:bg-gray-900 dark:text-gray-100 min-h-screen bg-gray-50 p-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-center mb-6 dark:text-white">Personal Subscription & Expense Tracker</h1>
            <!-- Metrics Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6" id="metricsContainer">
                <!-- Metrics will be injected here -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="space-y-8">
            <!-- Controls -->
            <section class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <!-- Add Subscription Button -->
                <button id="addBtn" class="w-full md:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:bg-indigo-500 dark:hover:bg-indigo-600">
                    + Add Subscription
                </button>

                <!-- Filter -->
                <div class="relative w-full md:w-auto">
                    <label for="categoryFilter" class="block text-sm font-medium mb-1 dark:text-white">Filter by Category</label>
                    <select id="categoryFilter" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-800 dark:border-gray-600 dark:text-white">
                        <option value="all">All Categories</option>
                        <option value="Streaming">Streaming</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Software">Software</option>
                        <option value="Health">Health</option>
                    </select>
                </div>

                <!-- Export/Import Buttons -->
                <div class="flex flex-col md:flex-row md:space-x-3 w-full md:w-auto">
                    <button id="exportBtn" class="w-full md:w-auto px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 dark:bg-green-500 dark:hover:bg-green-600">
                        Export CSV
                    </button>
                    <button id="importBtn" class="w-full md:w-auto px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:bg-blue-500 dark:hover:bg-blue-600">
                        Import CSV
                    </button>
                </div>
            </section>

            <!-- Subscription Table -->
            <section class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50 dark:bg-gray-700">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">Service</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">Category</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">Price</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">Billing Cycle</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">Renewal Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-700" id="subscriptionsTableBody">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Charts -->
            <section class="grid grid-cols-1 gap-6">
                <!-- Pie Chart -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-semibold mb-4 dark:text-white">Spending Breakdown by Category</h3>
                    <canvas id="pieChart" height="200"></canvas>
                </div>

                <!-- Bar Chart -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-semibold mb-4 dark:text-white">12-Month Expense Projection</h3>
                    <canvas id="barChart" height="200"></canvas>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Subscription Modal -->
    <div id="subscriptionModal" class="fixed inset-0 z-50 flex items-center justify-black bg-black bg-opacity-50 hidden">
        <div class="relative w-full max-w-md mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-start">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white" id="modalTitle">Add New Subscription</h3>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="subscriptionForm" class="mt-4 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="name" class="block text-sm font-medium mb-1 dark:text-white">Subscription Name</label>
                        <input type="text" id="name" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>
                    <div>
                        <label for="category" class="block text-sm font-medium mb-1 dark:text-white">Category</label>
                        <select id="category" name="category" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                            <option value="Streaming">Streaming</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Software">Software</option>
                            <option value="Health">Health</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="price" class="block text-sm font-medium mb-1 dark:text-white">Price ($)</label>
                        <input type="number" id="price" name="price" step="0.01" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>
                    <div>
                        <label for="billingCycle" class="block text-sm font-medium mb-1 dark:text-white">Billing Cycle</label>
                        <select id="billingCycle" name="billingCycle" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                            <option value="monthly">Monthly</option>
                            <option value="quarterly">Quarterly</option>
                            <option value="annually">Annually</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label for="renewalDate" class="block text-sm font-medium mb-1 dark:text-white">Next Renewal Date</label>
                    <input type="date" id="renewalDate" name="renewalDate" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                </div>
                <div class="flex items-center">
                    <div class="flex items-center">
                        <input type="checkbox" id="active" name="active" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                        <label for="active" class="ml-2 block text-sm font-medium text-gray-900 dark:text-white">Active</label>
                    </div>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="button" id="cancelBtn" class="mr-3 px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 dark:bg-gray-600 dark:hover:bg-gray-500 dark:text-white">
                        Cancel
                    </button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:bg-indigo-500 dark:hover:bg-indigo-600">
                        Save Subscription
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize application state
        let subscriptions = [];
        let editingId = null;
        let pieChartInstance = null;
        let barChartInstance = null;

        // DOM Elements
        const metricsContainer = document.getElementById('metricsContainer');
        const subscriptionsTableBody = document.getElementById('subscriptionsTableBody');
        const addBtn = document.getElementById('addBtn');
        const subscriptionModal = document.getElementById('subscriptionModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const subscriptionForm = document.getElementById('subscriptionForm');
        const modalTitle = document.getElementById('modalTitle');
        const submitBtn = document.getElementById('submitBtn');
        const categoryFilter = document.getElementById('categoryFilter');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const pieChartCtx = document.getElementById('pieChart').getContext('2d');
        const barChartCtx = document.getElementById('barChart').getContext('2d');

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            loadFromElectronStorage();
            renderMetrics();
            renderTable();
            renderCharts();
            setupEventListeners();
        });

        // Event Listeners
        function setupEventListeners() {
            addBtn.addEventListener('click', openAddModal);
            closeModalBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);
            subscriptionForm.addEventListener('submit', handleFormSubmit);
            categoryFilter.addEventListener('change', () => {
                renderTable();
                renderCharts();
            });
            exportBtn.addEventListener('click', exportToCSV);
            importBtn.addEventListener('click', importFromCSV);
        }

        // Modal Functions
        function openAddModal() {
            editingId = null;
            modalTitle.textContent = 'Add New Subscription';
            subscriptionForm.reset();
            // Set default values
            document.getElementById('category').value = 'Streaming';
            document.getElementById('billingCycle').value = 'monthly';
            document.getElementById('active').checked = true;
            // Set renewal date to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('renewalDate').value = tomorrow.toISOString().split('T')[0];
            subscriptionModal.classList.remove('hidden');
        }

        function openEditModal(subscription) {
            editingId = subscription.id;
            modalTitle.textContent = 'Edit Subscription';
            document.getElementById('name').value = subscription.name;
            document.getElementById('category').value = subscription.category;
            document.getElementById('price').value = subscription.price;
            document.getElementById('billingCycle').value = subscription.billingCycle;
            document.getElementById('renewalDate').value = subscription.renewalDate;
            document.getElementById('active').checked = subscription.active;
            subscriptionModal.classList.remove('hidden');
        }

        function closeModal() {
            subscriptionModal.classList.add('hidden');
            editingId = null;
            subscriptionForm.reset();
        }

        // Form Submission
        async function handleFormSubmit(e) {
            e.preventDefault();
            const formData = new FormData(subscriptionForm);
            const subscriptionData = {
                id: editingId || Date.now(),
                name: formData.get('name'),
                category: formData.get('category'),
                price: parseFloat(formData.get('price')),
                billingCycle: formData.get('billingCycle'),
                renewalDate: formData.get('renewalDate'),
                active: formData.get('active') === 'on'
            };

            if (editingId) {
                // Update existing
                const index = subscriptions.findIndex(sub => sub.id === editingId);
                if (index !== -1) {
                    subscriptions[index] = subscriptionData;
                }
            } else {
                // Add new
                subscriptions.push(subscriptionData);
            }

            await saveToElectronStorage();
            renderMetrics();
            renderTable();
            renderCharts();
            closeModal();
        }

        // Subscription Actions
        async function toggleActive(id) {
            const subscription = subscriptions.find(sub => sub.id === id);
            if (subscription) {
                subscription.active = !subscription.active;
                await saveToElectronStorage();
                renderMetrics();
                renderTable();
                renderCharts();
            }
        }

        async function deleteSubscription(id) {
            if (confirm('Are you sure you want to delete this subscription?')) {
                subscriptions = subscriptions.filter(sub => sub.id !== id);
                await saveToElectronStorage();
                renderMetrics();
                renderTable();
                renderCharts();
            }
        }

        // Rendering Functions
        function renderMetrics() {
            const totalMonthly = calculateTotalMonthly();
            const activeCount = subscriptions.filter(sub => sub.active).length;
            const upcomingRenewals = countUpcomingRenewals();

            metricsContainer.innerHTML = `
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4">
                    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Total Monthly Spending</h3>
                    <p class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">$${totalMonthly.toFixed(2)}</p>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4">
                    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Active Subscriptions</h3>
                    <p class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">${activeCount}</p>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4">
                    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Upcoming Renewals (7 days)</h3>
                    <p class="text-2xl font-bold text-amber-600 dark:text-amber-400">${upcomingRenewals}</p>
                </div>
            `;
        }

        function renderTable() {
            const filtered = getFilteredSubscriptions();
            if (filtered.length === 0) {
                subscriptionsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">
                            No subscriptions found. Click "Add Subscription" to get started.
                        </td>
                    </tr>
                `;
                return;
            }

            subscriptionsTableBody.innerHTML = filtered.map(sub => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center space-x-3">
                            <div class="h-8 w-8 bg-indigo-100 rounded-full flex items-center justify-center dark:bg-indigo-900 dark:text-indigo-200">
                                ${sub.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <p class="text-sm font-medium text-gray-900 dark:text-white">${sub.name}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 dark:text-gray-300">${sub.category}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">$${sub.price}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 dark:text-gray-300">${sub.billingCycle}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 dark:text-gray-300">${formatDate(sub.renewalDate)}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${sub.active ? 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200' : 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200'}">
                            ${sub.active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                        <button onclick="openEditModal(${JSON.stringify(sub).replace(/"/g, '"')})" class="text-indigo-600 hover:text-indigo-900 dark:text-indigo-400 dark:hover:text-indigo-200">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v9m-7-2h7"></path>
                            </svg>
                        </button>
                        <button onclick="toggleActive(${sub.id})" class="text-${sub.active ? 'yellow-600' : 'blue-600'} hover:text-${sub.active ? 'yellow-800' : 'blue-800'} dark:text-${sub.active ? 'yellow-400' : 'blue-400'} dark:hover:text-${sub.active ? 'yellow-200' : 'blue-200'}">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 35V18a2 2 0 00-2-2h-1a2 2 0 01-2-2v-2a2 2 0 00-2-2h-2V3a2 2 0 00-2-2h-1a2 2 0 01-2-2h-1a2 2 0 00-2-2h-2V3a2 2 0 012-2h1a2 2 0 002 2h2a2 2 0 012 2v2a2 2 0 002 2h1a2 2 0 012 2v7a2 2 0 002 2h1"></path>
                            </svg>
                        </button>
                        <button onclick="deleteSubscription(${sub.id})" class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-200">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1-1V3a1 1 0 011-1h6a1 1 0 011-1v2m5 10v-6a1 1 0 00-1-1H6a1 1 0 00-1-1v6a1 1 0 001 1h6a1 1 0 001 1z"></path>
                            </svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function renderCharts() {
            const filtered = getFilteredSubscriptions();

            // Pie Chart - Spending by Category
            const categoryData = {};
            filtered.forEach(sub => {
                const monthlyCost = getMonthlyCost(sub);
                categoryData[sub.category] = (categoryData[sub.category] || 0) + monthlyCost;
            });

            const pieLabels = Object.keys(categoryData);
            const pieData = Object.values(categoryData);

            if (pieChartInstance) {
                pieChartInstance.data.labels = pieLabels;
                pieChartInstance.data.datasets[0].data = pieData;
                pieChartInstance.update();
            } else {
                pieChartInstance = new Chart(pieChartCtx, {
                    type: 'pie',
                    data: {
                        labels: pieLabels,
                        datasets: [{
                            data: pieData,
                            backgroundColor: [
                                'rgba(54, 162, 235, 0.8)',
                                'rgba(255, 99, 132, 0.8)',
                                'rgba(255, 206, 86, 0.8)',
                                'rgba(75, 192, 192, 0.8)',
                                'rgba(153, 102, 255, 0.8)',
                                'rgba(255, 159, 64, 0.8)'
                            ],
                            borderColor: [
                                'rgba(54, 162, 235, 1)',
                                'rgba(255, 99, 132, 1)',
                                'rgba(255, 206, 86, 1)',
                                'rgba(75, 192, 192, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 159, 64, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: '#374151'
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0,0,0,0.8)',
                                titleColor: '#fff',
                                bodyColor: '#fff'
                            }
                        }
                    }
                });
            }

            // Bar Chart - 12 Month Projection
            const months = [];
            const monthlyTotals = [];
            const today = new Date();

            for (let i = 0; i < 12; i++) {
                const futureDate = new Date(today);
                futureDate.setMonth(today.getMonth() + i);
                const monthName = futureDate.toLocaleString('default', { month: 'short' });
                months.push(monthName);

                let total = 0;
                filtered.forEach(sub => {
                    if (!sub.active) return;
                    const monthlyCost = getMonthlyCost(sub);
                    total += monthlyCost;
                });
                monthlyTotals.push(total);
            }

            if (barChartInstance) {
                barChartInstance.data.labels = months;
                barChartInstance.data.datasets[0].data = monthlyTotals;
                barChartInstance.update();
            } else {
                barChartInstance = new Chart(barChartCtx, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Projected Monthly Cost ($)',
                            data: monthlyTotals,
                            backgroundColor: 'rgba(54, 162, 235, 0.8)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    color: '#374151'
                                },
                                grid: {
                                    color: 'rgba(0,0,0,0.1)'
                                }
                            },
                            x: {
                                ticks: {
                                    color: '#374151'
                                },
                                grid: {
                                    display: false
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0,0,0,0.8)',
                                titleColor: '#fff',
                                bodyColor: '#fff'
                            }
                        }
                    }
                });
            }
        }

        // Helper Functions
        function getFilteredSubscriptions() {
            const filterValue = categoryFilter.value;
            if (filterValue === 'all') return subscriptions;
            return subscriptions.filter(sub => sub.category === filterValue);
        }

        function calculateTotalMonthly() {
            return getFilteredSubscriptions().reduce((total, sub) => {
                if (sub.active) {
                    return total + getMonthlyCost(sub);
                }
                return total;
            }, 0);
        }

        function getMonthlyCost(sub) {
            switch (sub.billingCycle) {
                case 'monthly': return sub.price;
                case 'quarterly': return sub.price / 3;
                case 'annually': return sub.price / 12;
                default: return sub.price;
            }
        }

        function countUpcomingRenewals() {
            const today = new Date();
            const sevenDaysLater = new Date(today);
            sevenDaysLater.setDate(today.getDate() + 7);

            return getFilteredSubscriptions().filter(sub => {
                if (!sub.active) return false;
                const renewalDate = new Date(sub.renewalDate);
                return renewalDate >= today && renewalDate <= sevenDaysLater;
            }).length;
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        // Electron Storage Functions
        async function loadFromElectronStorage() {
            try {
                subscriptions = await window.electronAPI.loadSubscriptions();
            } catch (error) {
                console.error('Error loading subscriptions:', error);
                // Fallback to sample data
                subscriptions = [
                    {
